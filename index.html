<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHAB Clothing | Luxury Ethiopian Fashion</title>
    <meta name="description" content="Production-ready luxury fashion e-commerce for AHAB Clothing, an independent Ethiopian designer brand based in Addis Ababa creating traditional and modern cultural couture." />
    <meta property="og:title" content="AHAB Clothing | Luxury Ethiopian Fashion" />
    <meta property="og:description" content="Contemporary Ethiopian fashion crafted with love. Traditional attire, modern cultural couture, and bespoke custom design from Addis Ababa." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/src/assets/images/ahab_hero_editorial_1790496991182.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AHAB Clothing | Made With Love" />
    <meta name="twitter:description" content="Timeless luxury fashion celebrating Ethiopian heritage and modern artisanal elegance." />
    <meta name="theme-color" content="#EFE5D6" />

    <!-- Google Fonts Preconnect & High-Fashion Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD Structured Data for Brand & Retail Store -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "AHAB Clothing",
      "alternateName": "AHAB Addis Ababa",
      "description": "Independent Ethiopian luxury fashion brand creating traditional and modern cultural couture.",
      "url": "https://ahabclothing.com",
      "logo": "https://ahabclothing.com/logo.svg",
      "slogan": "Made With Love",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Bole Medhanialem, Camise District",
        "addressLocality": "Addis Ababa",
        "addressCountry": "ET"
      },
      "priceRange": "$$$",
      "currenciesAccepted": "ETB, USD, EUR, GBP",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "09:00",
          "closes": "19:00"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#EFE5D6] text-[#2A0D08] font-sans antialiased selection:bg-[#B68A4C]/25 selection:text-[#2A0D08]">
